# General settings
site_name: "Sampath Kumar | AI & Cloud Blog"
site_description: Personal blog of Sampath Kumar M
site_author: M Sampath Kumar

# exclude_docs: |
#   blog/posts/images/

# Repository
# repo_name: Github
# repo_url: https://github.com/msampathkumar/msampathkumar.github.io/

# Copyright
copyright: Copyright 2024 © M Sampath Kumar
theme:
  name: material
  favicon: assets/images/favicon.svg
  icon:
    logo: material/book-open-page-variant
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
  font:
    text: Inter
    code: Fira Code
  palette:
    # Palette toggle for light mode — white + pastel pink accent
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode — soft black + light blue accent
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    # - navigation.indexes # for blog/index.md
    - navigation.tabs
    - navigation.top
    - navigation.instant
    # - navigation.expand
    - navigation.path
    - navigation.tracking
    # toc.integrate is intentionally OFF so the table of contents renders as a
    # right-hand sidebar (right nav) instead of being folded into the left nav.
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

# Custom styles & scripts. NOTE: these MUST be top-level keys (not nested under
# `theme:`) — MkDocs only injects <link>/<script> tags for the top-level
# extra_css/extra_javascript. Nesting them under `theme:` silently drops them.
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/reading-progress.js

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - meta
  # NOTE: the Material 'blog' plugin is intentionally NOT enabled: it takes
  # ownership of blog/posts/ and excludes those files from the manual nav,
  # which would break the curated "Writing" tab. Latest-posts on the Home page
  # are generated by hooks/latest_posts.py instead; new posts are added via
  # `make new-post` (see Makefile), which also wires them into the nav.
  - search
  - mermaid2
  # Material's built-in media optimizer (free since 9.7.0). Optimizes .jpg via
  # Pillow at build time (cached in .cache/plugin/optimize). PNG optimization is
  # OFF because it needs the `pngquant` system binary; to enable it, install
  # pngquant (e.g. `sudo apt-get install pngquant`) and drop `optimize_png`.
  - optimize:
      optimize_png: false
  - git-revision-date-localized:
      type: timeago
  # Preserve old /blog/posts/<slug>/ URLs after the move to /writing/<section>/
  # <slug>/. On GitHub Pages these emit client-side meta-refresh stubs (not
  # 301s) — enough to keep inbound links and the search index from 404ing.
  # Keys/values are doc source paths relative to docs/. Keep this map in sync
  # whenever a post is moved or renamed.
  - redirects:
      redirect_maps:
        blog/posts/a2a_multi_tenancy.md: writing/a2a/multi-tenancy/index.md
        blog/posts/a2a_intro.md: writing/a2a/intro/index.md
        blog/posts/a2a_v1_release.md: writing/a2a/v1-release/index.md
        blog/posts/a2a_test_kit.md: writing/a2a/test-kit/index.md
        blog/posts/a2a_security_whitepaper.md: writing/a2a/security-whitepaper/index.md
        blog/posts/google-cloud-next-2026-agentic-cloud-infrastructure.md: writing/cloud-next-2026/infrastructure/index.md
        blog/posts/google-cloud-next-2026-gap-foundational-models.md: writing/cloud-next-2026/foundational-models/index.md
        blog/posts/google-cloud-next-2026-dev-tools-mcp-servers.md: writing/cloud-next-2026/dev-tools-mcp-servers/index.md
        blog/posts/google-cloud-next-2026-agentic-data-protocols-security.md: writing/cloud-next-2026/data-protocols-security/index.md
        blog/posts/google-cloud-next-2026-workspace-ai-agents.md: writing/cloud-next-2026/workspace-ai-agents/index.md
        blog/posts/gemini-cli-cheatsheet-printouts.md: writing/gemini/cli-cheatsheets/index.md
        blog/posts/gemini-cli-top-commands.md: writing/gemini/cli-top-commands/index.md
        blog/posts/gemini-2.5-flash-image-preview.md: writing/gemini/flash-image-preview/index.md
        blog/posts/gemini-as-your-culinary-guide.md: writing/gemini/culinary-guide/index.md
        blog/posts/the-six-essential-protocols-powering-the-ai-agent-ecosystem.md: writing/technical/six-essential-protocols/index.md
        blog/posts/the-role-of-python-in-google-cloud.md: writing/technical/python-in-google-cloud/index.md
        blog/posts/advanced-memory-management-agentic-ai.md: writing/technical/memory-management-agentic-ai/index.md
        blog/posts/gke_magic_quadrant.md: writing/technical/gke-magic-quadrant/index.md
        blog/posts/vibe-coding-intro.md: writing/technical/vibe-coding-intro/index.md
        blog/posts/vibe-coding-dos-donts.md: writing/technical/vibe-coding-dos-donts/index.md
        blog/posts/miyamoto-musashi-10-principles.md: writing/personal/miyamoto-musashi/index.md
        blog/posts/poem-sky-sea-truth.md: writing/personal/sky-sea-truth/index.md
        blog/posts/spot-fakes-leaders.md: writing/personal/spot-fake-leaders/index.md
        blog/posts/two-lenses-of-leadership.md: writing/personal/two-lenses-of-leadership/index.md
        blog/notes/google-cloud-vm-for-agentic-coding-harness-experiments.md: writing/technical/building-agentic-sandbox-vm/index.md
        blog/notes/google-cloud-vm-setup-gui-and-remote-desktop.md: writing/technical/setup-gui-chrome-remote-desktop-gcp-vm/index.md
        blog/posts/conductor-gemini-cli.md: writing/technical/conductor-gemini-cli/index.md
        blog/posts/documentation-driven-development.md: writing/technical/documentation-driven-development/index.md
        blog/posts/quantum-ai-era.md: writing/technical/quantum-ai-era/index.md
        writing/technical/agentic-ai-vm-setup/index.md: writing/technical/building-agentic-sandbox-vm/index.md
        writing/technical/agentic-sandbox-vm-setup/index.md: writing/technical/building-agentic-sandbox-vm/index.md
        writing/technical/agentic-sandbox-vm/index.md: writing/technical/building-agentic-sandbox-vm/index.md
        writing/technical/gcp-vm-gui-remote-desktop/index.md: writing/technical/setup-gui-chrome-remote-desktop-gcp-vm/index.md
        writing/technical/agentic-sandbox-gui/index.md: writing/technical/setup-gui-chrome-remote-desktop-gcp-vm/index.md
        writing/technical/setup-gui-chrome-remote-desktop/index.md: writing/technical/setup-gui-chrome-remote-desktop-gcp-vm/index.md

# Build hooks
hooks:
  - hooks/latest_posts.py

# Additional configuration
extra:
  status:
    new: Recently added
    deprecated: Deprecated
  analytics:
    # https://analytics.google.com/analytics/web/
    provider: google
